<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGAdamVR</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #ff0033;
            box-shadow: 0 0 25px #ff0033;
            margin-top: 20px;
            object-fit: cover;
        }
        h1 {
            font-size: 32px;
            margin: 15px 0 30px 0;
            font-weight: bold;
        }
        .card {
            background-color: #111116;
            border-radius: 14px;
            padding: 16px;
            margin: 12px auto;
            max-width: 380px;
            text-align: left;
            border: 1px solid #22222e;
            text-decoration: none;
            display: block;
        }
        .card h3 { 
            color: #ff2a4b; 
            margin: 0 0 6px 0; 
            font-size: 20px;
        }
        .card p { 
            color: #a0a0b0; 
            margin: 0; 
            font-size: 14px; 
        }
    </style>
</head>
<body>

    <!-- Replace 'your-avatar.jpg' with your image link or file name -->
    <img src="your-avatar.jpg" class="profile-img" alt="OGAdamVR Avatar">
    
    <h1>OGAdamVR</h1>

    <!-- Link Cards -->
    <a href="#" class="card">
        <h3>Button Title 1</h3>
        <p>Description text goes here...</p>
    </a>

    <a href="#" class="card">
        <h3>Button Title 2</h3>
        <p>Description text goes here...</p>
    </a>

</body>
</html>
