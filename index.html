<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGAdamVR</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #ff0033;
            box-shadow: 0 0 25px #ff0033;
            margin-top: 20px;
            object-fit: cover;
        }
        h1 {
            font-size: 32px;
            margin: 15px 0 20px 0;
            font-weight: bold;
        }
        .page {
            display: none; /* Hides pages by default */
        }
        .page.active {
            display: block; /* Shows only the active page */
        }
        .card {
            background-color: #111116;
            border-radius: 14px;
            padding: 16px;
            margin: 12px auto;
            max-width: 380px;
            text-align: left;
            border: 1px solid #22222e;
            text-decoration: none;
            display: block;
            cursor: pointer;
        }
        .card h3 { 
            color: #ff2a4b; 
            margin: 0 0 6px 0; 
            font-size: 20px;
        }
        .card p { 
            color: #a0a0b0; 
            margin: 0; 
            font-size: 14px; 
        }
        .back-btn {
            background: #ff0033;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <img src="your-avatar.jpg" class="profile-img" alt="OGAdamVR Avatar">
    <h1>OGAdamVR</h1>

    <!-- MAIN HOME PAGE -->
    <div id="home" class="page active">
        <!-- Click this card to open Sub Page 1 -->
        <div class="card" onclick="openPage('page1')">
            <h3>Frida Tools</h3>
            <p>Click to open Frida downloads & tools</p>
        </div>

        <!-- Click this card to open Sub Page 2 -->
        <div class="card" onclick="openPage('page2')">
            <h3>Animal Company Mods</h3>
            <p>Standalone no-PC mods for Animal Company</p>
        </div>
    </div>

    <!-- SUB PAGE 1 (Hidden until clicked) -->
    <div id="page1" class="page">
        <button class="back-btn" onclick="openPage('home')">← Go Back</button>
        
        <a href="https://google.com" target="_blank" class="card">
            <h3>Frida Tool #1</h3>
            <p>Download link or details for tool 1</p>
        </a>
        <a href="https://google.com" target="_blank" class="card">
            <h3>Frida Tool #2</h3>
            <p>Download link or details for tool 2</p>
        </a>
    </div>

    <!-- SUB PAGE 2 (Hidden until clicked) -->
    <div id="page2" class="page">
        <button class="back-btn" onclick="openPage('home')">← Go Back</button>

        <a href="https://google.com" target="_blank" class="card">
            <h3>EIC Mod</h3>
            <p>Direct download link</p>
        </a>
    </div>

    <!-- JavaScript to switch pages -->
    <script>
        function openPage(pageId) {
            // Hide all pages
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));

            // Show the selected page
            document.getElementById(pageId).classList.add('active');
        }
    </script>

</body>
</html>
